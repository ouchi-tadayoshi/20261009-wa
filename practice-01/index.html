<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>お知らせ一覧（配列）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="news">
        <h1>お知らせ</h1>

        <ul class="news-list">
          <li v-for="item in news">
            <a href="#">{{ item }}</a>
          </li>
        </ul>
    </div>
  </div>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="script.js"></script>
</body>
</html>
